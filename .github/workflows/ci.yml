name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: novarent, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: novarent_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novarent" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias e integración (SQLite) con cobertura >= 80 %
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Casos de prueba NovaRent (evidencia)
        run: python scripts/ejecutar_casos.py
      - name: Integración contra PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://novarent:ci_password@localhost:5432/novarent_test
        run: pytest tests/integration -q
      - name: Construir imagen Docker
        run: docker build -t novarent .
